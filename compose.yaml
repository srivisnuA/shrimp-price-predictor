services:
  forecast:
    build: .
    ports:
      - '127.0.0.1:8766:8000'
    environment:
      SHRIMP_ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
